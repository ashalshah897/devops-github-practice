name: Docker Publish

on:
  push:
    branches:
      - main-s
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ashalraza12
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image locally
        run: docker build -t calculator-app:scan .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'calculator-app:scan'
          scanners: 'vuln,secret'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'

      - name: Tag Docker image
        run: |
          docker tag calculator-app:scan ashalraza12/calculator-app:latest
          docker tag calculator-app:scan ashalraza12/calculator-app:main

      - name: Push Docker image to Docker Hub
        run: |
          docker push ashalraza12/calculator-app:latest
          docker push ashalraza12/calculator-app:main
