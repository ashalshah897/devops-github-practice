name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:

  test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: python -m unittest discover -s tests

  sonarqube:
    name: SonarQube Scan
    runs-on: self-hosted
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: SonarQube Scan
        run: |
          pip install pysonar&& pysonar --sonar-host-url=http://localhost:9000 --sonar-token=sqp_4fdf574a5ded13270488a1f10e0390cde66879b9 --sonar-project-key=calculator-app

